<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stride — Button</title>
    <style>
      :root {
        --bg-100: hsl(0, 0%, 100%);
        --bg-200: hsl(0, 0%, 98%);
        --gray-100: hsl(0, 0%, 95%);
        --gray-200: hsl(0, 0%, 92%);
        --gray-400: hsl(0, 0%, 92%);
        --gray-700: hsl(0, 0%, 56%);
        --gray-900: hsl(0, 0%, 30%);
        --gray-1000: hsl(0, 0%, 9%);
        --red-800: hsl(358, 70%, 52%);
        --amber-800: hsl(35, 100%, 52%);
        --contrast-fg: #fff;
        --hover-overlay: rgba(0, 0, 0, 0.05);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 40px;
        background: var(--bg-200);
        color: var(--gray-1000);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 920px; margin: 0 auto; }
      h1 { font-size: 32px; line-height: 40px; letter-spacing: -0.02em; font-weight: 600; margin: 0 0 4px; }
      .lede { color: var(--gray-900); font-size: 16px; margin: 0 0 32px; }

      table { border-collapse: collapse; width: 100%; }
      th, td { padding: 12px 14px; text-align: left; vertical-align: middle; }
      thead th {
        font-size: 12px; font-weight: 600; color: var(--gray-700);
        border-bottom: 1px solid var(--gray-400);
      }
      tbody td { border-bottom: 1px solid var(--gray-200); }
      tbody th {
        font-size: 13px; font-weight: 600; color: var(--gray-900);
        border-bottom: 1px solid var(--gray-200);
      }

      /* ---- Button (faithful to src/components/ui/Button.tsx) ---- */
      .btn {
        display: inline-flex; align-items: center; justify-content: center;
        user-select: none; border: 0; cursor: pointer;
        font-weight: 500; white-space: nowrap;
        transition: background 150ms ease-in-out, box-shadow 150ms ease-in-out,
          color 150ms ease-in-out;
      }
      .btn .content { display: inline-block; padding: 0 6px; }

      /* sizes: height / padding-x / gap / font / radius */
      .sz--tiny   { height: 24px; padding: 0 6px;  gap: 4px; font-size: 12px; line-height: 16px; border-radius: 4px; }
      .sz--small  { height: 32px; padding: 0 6px;  gap: 6px; font-size: 14px; line-height: 20px; border-radius: 6px; }
      .sz--medium { height: 40px; padding: 0 10px; gap: 8px; font-size: 14px; line-height: 20px; border-radius: 6px; }
      .sz--large  { height: 48px; padding: 0 14px; gap: 8px; font-size: 16px; line-height: 20px; border-radius: 8px; }

      /* variants */
      .btn--default { background: var(--gray-1000); color: var(--bg-100); }
      .btn--default:hover { background: color-mix(in srgb, var(--gray-1000), white 15%); }

      .btn--error { background: var(--red-800); color: var(--contrast-fg); }
      .btn--error:hover { background: #ae292f; }

      .btn--warning { background: var(--amber-800); color: #0a0a0a; }
      .btn--warning:hover { background: #d27504; }

      .btn--secondary { background: var(--bg-100); color: var(--gray-1000); box-shadow: 0 0 0 1px var(--gray-400); }
      .btn--secondary:hover { background: var(--gray-100); }

      .btn--tertiary { background: transparent; color: var(--gray-1000); }
      .btn--tertiary:hover { background: var(--hover-overlay); }

      .vname { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Button</h1>
      <p class="lede">
        Five variants × four sizes. Primary actions use <code>default</code>;
        <code>secondary</code> is the hairline chip, <code>tertiary</code> is
        ghost. Radius tracks size (4 / 6 / 6 / 8px).
      </p>

      <table>
        <thead>
          <tr>
            <th>Variant</th>
            <th>Tiny</th>
            <th>Small</th>
            <th>Medium</th>
            <th>Large</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th class="vname">default</th>
            <td><button class="btn btn--default sz--tiny"><span class="content">Upload</span></button></td>
            <td><button class="btn btn--default sz--small"><span class="content">Upload</span></button></td>
            <td><button class="btn btn--default sz--medium"><span class="content">Upload</span></button></td>
            <td><button class="btn btn--default sz--large"><span class="content">Upload</span></button></td>
          </tr>
          <tr>
            <th class="vname">secondary</th>
            <td><button class="btn btn--secondary sz--tiny"><span class="content">Cancel</span></button></td>
            <td><button class="btn btn--secondary sz--small"><span class="content">Cancel</span></button></td>
            <td><button class="btn btn--secondary sz--medium"><span class="content">Cancel</span></button></td>
            <td><button class="btn btn--secondary sz--large"><span class="content">Cancel</span></button></td>
          </tr>
          <tr>
            <th class="vname">tertiary</th>
            <td><button class="btn btn--tertiary sz--tiny"><span class="content">Learn more</span></button></td>
            <td><button class="btn btn--tertiary sz--small"><span class="content">Learn more</span></button></td>
            <td><button class="btn btn--tertiary sz--medium"><span class="content">Learn more</span></button></td>
            <td><button class="btn btn--tertiary sz--large"><span class="content">Learn more</span></button></td>
          </tr>
          <tr>
            <th class="vname">error</th>
            <td><button class="btn btn--error sz--tiny"><span class="content">Delete</span></button></td>
            <td><button class="btn btn--error sz--small"><span class="content">Delete</span></button></td>
            <td><button class="btn btn--error sz--medium"><span class="content">Delete</span></button></td>
            <td><button class="btn btn--error sz--large"><span class="content">Delete</span></button></td>
          </tr>
          <tr>
            <th class="vname">warning</th>
            <td><button class="btn btn--warning sz--tiny"><span class="content">Proceed</span></button></td>
            <td><button class="btn btn--warning sz--small"><span class="content">Proceed</span></button></td>
            <td><button class="btn btn--warning sz--medium"><span class="content">Proceed</span></button></td>
            <td><button class="btn btn--warning sz--large"><span class="content">Proceed</span></button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
